name: Docker images

# Builds the resolver and frontend images on every PR (no push), and publishes
# them to GitHub Container Registry on main and on version tags:
#   ghcr.io/<owner>/novak-resolver:{latest,sha-…,vX.Y.Z}
#   ghcr.io/<owner>/novak-frontend:{latest,sha-…,vX.Y.Z}
# The frontend bakes NEXT_PUBLIC_* in at build time: set them as repository
# Variables (Settings → Secrets and variables → Actions → Variables).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [resolver, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novak-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=ref,event=pr

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
          build-args: |
            NEXT_PUBLIC_CHAIN_ID=${{ vars.NEXT_PUBLIC_CHAIN_ID || '46630' }}
            NEXT_PUBLIC_RESOLVER_URL=${{ vars.NEXT_PUBLIC_RESOLVER_URL }}
            NEXT_PUBLIC_ALCHEMY_API_KEY=${{ vars.NEXT_PUBLIC_ALCHEMY_API_KEY }}
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
