[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

# NOTE: `derivatives/` and `consumers/` are not listed as Foundry `src`
# roots — Foundry only has one src dir. Their contracts are picked up via the
# import graph because test/ files (and script/Deploy.s.sol) import them
# directly (e.g. "../../derivatives/Market.sol").
# This keeps one toolchain/one `forge build` for both contracts/ and
# derivatives/ without duplicating config.

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 128
depth = 50

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
local = "${RPC_URL_LOCAL}"
robinhood_testnet = "${RPC_URL_ROBINHOOD_TESTNET}"

# Contract verification on Robinhood Chain goes through Blockscout, which
# accepts any non-empty key:
#   forge script script/Deploy.s.sol --rpc-url robinhood_testnet --broadcast --verify
[etherscan]
robinhood_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api" }
