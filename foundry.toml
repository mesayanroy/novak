[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

# NOTE: `derivatives/` is not listed as a Foundry `src` root — Foundry only
# has one src dir. Its contracts are picked up via the import graph because
# test/ files import them directly (e.g. "../../derivatives/Market.sol").
# This keeps one toolchain/one `forge build` for both contracts/ and
# derivatives/ without duplicating config.

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 128
depth = 50

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
local = "${RPC_URL_LOCAL}"
testnet = "${RPC_URL_TESTNET}"

[etherscan]
testnet = { key = "${ETHERSCAN_API_KEY}" }
